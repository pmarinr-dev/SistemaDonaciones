[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sistema-donaciones"
version = "1.0.0"
description = "Sistema Integral de Gestión y Distribución de Donaciones Post-Desastre (Colombia)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
sistema-donaciones = "sistema_donaciones.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
markers = [
    "benchmark: pruebas de rendimiento (se pueden omitir con -m 'not benchmark')",
]
